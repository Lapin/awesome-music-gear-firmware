name: Check links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --accept 200,429 README.md
          fail: false
      - name: Open issue on broken links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links
          content-filepath: ./lychee/out.md
          labels: broken-links
